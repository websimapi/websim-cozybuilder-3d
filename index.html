<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CozyBuilder 3D</title>
    
    <!-- Three.js, React & Fiber via import map -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "three": "https://esm.sh/three@0.160.0",
                "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.14?external=react,react-dom,three",
                "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
                "uuid": "https://esm.sh/uuid@9.0.1",
                "idb": "https://esm.sh/idb@8.0.0",
                "lucide-react": "https://esm.sh/lucide-react@0.309.0?external=react"
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Environment Mock for standalone testing/fallback -->
    <script>
        if (typeof WebsimSocket === 'undefined') {
            window.WebsimSocket = class {
                collection() { 
                    return {
                        filter: () => ({ getList: async () => [] }),
                        create: async (d) => ({ id: 'mock_id', ...d }),
                        update: async () => {},
                        get: async () => null
                    }
                }
            };
        }
        if (!window.websim) {
            window.websim = {
                getCurrentUser: async () => ({ username: 'guest', id: 'guest' }),
                upload: async (file) => URL.createObjectURL(file),
                chat: { completions: { create: async () => ({ content: '{}' }) } }
            };
        }
    </script>
    
    <style>
        /* Cozy Theme Variables */
        :root {
            --cream: #fdfbf7;
            --sand: #e8e4da;
            --wood: #8d7b68;
            --clay: #c8b6a6;
            --sage: #a4ac86;
            --dark: #4a4036;
        }
        
        body {
            background-color: var(--cream);
            color: var(--dark);
            font-family: 'Nunito', sans-serif;
            overflow: hidden; /* Prevent scrolling, app handles it */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--sand);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--clay);
            border-radius: 4px;
        }

        .glass-panel {
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(74, 64, 54, 0.1);
        }

        .cozy-btn {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cozy-btn:active {
            transform: scale(0.95);
        }
        
        .asset-card {
            transition: transform 0.2s ease;
        }
        .asset-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(74, 64, 54, 0.15);
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid var(--sand);
            border-top: 3px solid var(--wood);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <!-- Font for Coziness -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" src="./js/app.js"></script>

</body>
</html>
